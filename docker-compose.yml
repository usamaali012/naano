services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: naano
    ports:
      - "5432:5432"
    volumes:
      - naano_postgres_data:/var/lib/postgresql/data

volumes:
  naano_postgres_data:
